<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESCape32 Wi-Fi Link</title>
<style>
:root {
	--222: #222;
	--bbb: #bbb;
	--ccc: #ccc;
	--ddd: #ddd;
	--eee: #eee;
	--fff: #fff;
	--red: #e20;
	--grn: #090;
	--sel: #3563bf;
	--val: #39558f;
}
@media (prefers-color-scheme: dark) {
:root {
	--222: #ddd;
	--bbb: #666;
	--ccc: #555;
	--ddd: #444;
	--eee: #333;
	--fff: #222;
	--red: #e20;
	--grn: #2b2;
	--sel: #72a2e0;
	--val: #99c6ff;
}}
body {
	font-family: -apple-system, "Trebuchet MS", Helvetica, Arial, sans-serif;
	font-size: 1em;
	line-height: 1.4em;
	background: var(--fff);
	color: var(--222);
	padding: 0;
	margin: 0;
}
#main {
	padding: 0.4em;
	margin: 0 auto;
	min-width: 22em;
}
p {
	margin: 0.5em 0 0 0;
}
a {
	color: var(--222);
}
b {
	border: 1px solid var(--ccc);
	border-radius: 2px;
	background: var(--eee);
	color: var(--red);
	padding: 0.1em 0.2em;
}
hr {
	background: none;
	border: medium none;
	border-bottom: 1px solid var(--ddd);
	margin: 0.8em 0 0.6em 0;
}
label {
	white-space: nowrap;
}
input, button, select, textarea {
	border: 1px solid var(--ccc);
	border-radius: 5px;
	background: var(--eee);
	color: var(--val);
	font-size: 1em;
	padding: 0.2em 0.4em;
	margin: 0;
	cursor: pointer;
}
input:disabled {
	background: var(--eee);
	color: var(--bbb);
}
input[type=checkbox] {
	margin: 0.1em;
}
input[type=range] {
	/* Commented out due to a bug in Android. Thank you, Android! */
	/*-webkit-appearance: none;
	-moz-appearance: none;
	appearance: none;*/
	border-radius: 4px;
	height: 1px;
	width: 20em;
}
input[type=range]:hover {
	background: var(--ddd);
}
input[type=range]:active {
	background: var(--ccc);
}
button {
	border-radius: 0;
	transition: 0.2s;
}
button:hover {
	background: var(--ddd);
}
button:active {
	background: var(--ccc);
}
button.btn-reboot {
	background: #c62828;
	color: #fff;
}
button.btn-reboot:hover {
	background: #e53935;
}
button.btn-reboot:active {
	background: #b71c1c;
}
textarea {
	height: 8em;
	width: 20em;
}
progress {
	-webkit-appearance: none;
	-moz-appearance: none;
	appearance: none;
	border: 1px solid var(--ccc);
	border-radius: 4px;
	background: var(--eee);
	height: 8px;
	width: 20em;
}
::-webkit-progress-bar {
	border-radius: 4px;
	background: var(--eee);
}
::-webkit-progress-value {
	border-radius: 4px;
	background: var(--grn);
}
::-moz-progress-bar {
	border-radius: 2px;
	background: var(--grn);
}
#menu {
	border: 1px solid var(--ccc);
	background: var(--eee);
	overflow: hidden;
}
#menu button {
	float: left;
	border: none;
	padding: 0.8em;
}
#menu button.active {
	background: var(--sel);
	color: var(--fff);
}
#lang {
	float: right;
	margin: 0.2em;
	font-size: 0.6em;
}
.tab {
	border: 1px solid var(--ccc);
	border-top: none;
	overflow: hidden;
	display: none;
	padding: 0.8em;
}
.show {
	width: 20em;
}
.show .min {
	white-space: nowrap;
	width: 1px;
}
.show label {
	font-weight: bold;
}
.show .val {
	text-align: right;
	width: 3em;
}
.show .str {
	text-align: left;
	width: 12em;
}
.show .greyed {
	color: var(--bbb);
}
.result {
	font-weight: bold;
	padding-left: 0.5em;
}
.hint {
	font-size: 0.8em;
}
#info {
	font-family: Menlo, Monaco, Consolas, "Lucida Console", monospace;
	font-size: 0.9em;
	line-height: 1.2em;
	white-space: pre;
}
#telem {
	margin-top: 0.6em;
}
#telemtoolbar {
	display: flex;
	align-items: center;
	justify-content: space-between;
	flex-wrap: wrap;
	gap: 0.4em;
	margin-bottom: 0.4em;
}
#telemseries {
	display: flex;
	flex-wrap: wrap;
	gap: 0.3em 0.8em;
	font-size: 0.85em;
}
#telemseries label {
	cursor: pointer;
	user-select: none;
}
#telemctrl {
	display: flex;
	align-items: center;
	gap: 0.4em;
	margin-left: auto;
}
#telemchart {
	display: block;
	width: 100%;
	height: 180px;
	background: var(--eee);
	border: 1px solid var(--ddd);
	border-radius: 4px;
}
#fwinfo {
	white-space: nowrap;
}
#footer {
	font-size: 0.6em;
	text-align: right;
}
</style>
</head>
<body>
<div id="main">
	<div id="menu">
		<button class="item" id="item1" data-lang="S00" onclick="opentab(1)"></button>
		<button class="item" id="item2" data-lang="S01" onclick="opentab(2)"></button>
		<button class="item" id="item3" data-lang="S02" onclick="opentab(3)"></button>
		<select id="lang" onchange="setlang(value)">@LANG_OPTS@</select>
	</div>
	<div class="tab" id="tab1off" data-lang="S03"></div>
	<div class="tab" id="tab1on">
		<table class="show" id="show"></table>
		<p>
			<button data-lang="B00" onclick="savecfg()"></button>
			<button data-lang="B06" onclick="exportcfg()"></button>
			<button data-lang="B07" onclick="document.getElementById('cfgfile').click()"></button>
			<input type="file" id="cfgfile" accept=".json,application/json" style="display:none" onchange="importcfg(this)">
			<button data-lang="B01" onpointerdown="resetcfg()" onpointerup="resetcfg(true)" onpointerleave="resetcfg(true)" onpointercancel="resetcfg(true)"></button>
			<button class="btn-reboot" data-lang="B08" onclick="rebootesc()"></button>
			<span class="result" id="result1"></span>
		</p>
		<hr>
		<div id="info"></div>
		<input type="range" min="0" max="2000" value="0" id="throt" oninput="setthrot(value)">
		<div class="hint" data-lang="H00"></div>
		<div id="telem">
			<div id="telemtoolbar">
				<div id="telemseries">
					<label><input type="radio" name="telemseries" value="Temp" onchange="drawTelemChart()"> Temp</label>
					<label><input type="radio" name="telemseries" value="ext" onchange="drawTelemChart()"> ext</label>
					<label><input type="radio" name="telemseries" value="Volt" checked onchange="drawTelemChart()"> Volt</label>
					<label><input type="radio" name="telemseries" value="Curr" onchange="drawTelemChart()"> Curr</label>
					<label><input type="radio" name="telemseries" value="Csum" onchange="drawTelemChart()"> Csum</label>
					<label><input type="radio" name="telemseries" value="ERPM" onchange="drawTelemChart()"> ERPM</label>
				</div>
				<div id="telemctrl">
					<button id="telemrun" data-lang="B10" onclick="toggleTelemRun()"></button>
					<button id="telemclr" data-lang="B03" onclick="clearTelemChart()"></button>
					<button id="telemexport" data-lang="B11" onclick="exportTelemCsv()"></button>
					<select id="telemhz" onchange="setTelemHz(value)">
						<option value="2" selected>2hz</option>
						<option value="4">4hz</option>
						<option value="6">6hz</option>
						<option value="8">8hz</option>
						<option value="10">10hz</option>
					</select>
					<select id="telemwin" onchange="setTelemWindow(value)">
						<option value="1" selected>1min</option>
						<option value="2">2min</option>
						<option value="3">3min</option>
						<option value="4">4min</option>
						<option value="5">5min</option>
						<option value="6">6min</option>
						<option value="7">7min</option>
						<option value="8">8min</option>
						<option value="9">9min</option>
						<option value="10">10min</option>
					</select>
				</div>
			</div>
			<canvas id="telemchart" width="640" height="180"></canvas>
		</div>
	</div>
	<div class="tab" id="tab2off" data-lang="S04"></div>
	<div class="tab" id="tab2on">
		<textarea id="music" maxlength="500"></textarea>
		<div class="hint" data-lang="H01"></div>
		<input type="range" min="0" max="100" id="volume" oninput="setvolume(value)">
		<div class="hint">
			<span data-lang="S06"></span>
			<span id="volval"></span>
		</div>
		<p>
			<button data-lang="B02" onclick="playmusic()"></button>
			<button data-lang="B00" onclick="savemusic()"></button>
			<button data-lang="B03" onclick="clearmusic()"></button>
			<span class="result" id="result2"></span>
		</p>
		<hr>
		<div class="hint" data-lang="H02"></div>
	</div>
	<div class="tab" id="tab3off">
		<div data-lang="S05"></div>
		<div class="hint" data-lang="H03"></div>
	</div>
	<div class="tab" id="tab3on">
		<table>
			<tr><td><label for="image" data-lang="S07"></label></td><td><input type="file" id="image" accept=".bin"></td></tr>
			<tr><td><label for="boot" data-lang="S08"></label></td><td>
				<select id="boot">
					<option value="0" data-lang="I02"></option>
					<option value="1" data-lang="I01"></option>
				</select>
			</td></tr>
			<tr><td><label for="wrp" data-lang="S09"></label></td><td>
				<select id="wrp">
					<option value="0">--</option>
					<option value="0x33" data-lang="I00"></option>
					<option value="0x44" data-lang="I01"></option>
					<option value="0x55" data-lang="I03"></option>
				</select>
				<button onclick="setwrp()" data-lang="B04"></button>
				<span class="result" id="result3"></span>
			</td></tr>
			<tr><td><label for="force" data-lang="S10"></label></td><td>
				<input type="checkbox" id="force">
				<span class="hint" data-lang="H04"></span>
			</td></tr>
		</table>
		<p>
			<button id="update" onclick="update()" data-lang="B05"></button>
			<span class="result" id="result4"></span>
		</p>
		<progress id="status" value="0" max="100"></progress>
		<hr>
		<div id="fwinfo"></div>
	</div>
	<div id="footer">ESCape32 Wi-Fi Link @PROJECT_VER@ (escape32.org)</div>
</div>
<script>
const bitvals = {};

function bitfield(n) {
	return (key, val) => {
		const res = [];
		for (let i = 0; i < n; ++i) {
			let bit = 1 << i;
			res.push(`<input type="checkbox" class="field_${key}"${val & bit ? ' checked' : ''} onchange="setbit('${key}', ${bit}, checked)">`);
		}
		bitvals[key] = val;
		return res.join('');
	}
}

function setbit(key, bit, on) {
	setparam(key, (on ? bitvals[key] | bit : bitvals[key] & ~bit).toString());
}

const params = {
	arm: false,
	damp: false,
	revdir: false,
	brushed: false,
	duty_lock: ['I00', 'I14', 'I15'],
	throt_mode: ['I04', 'I05', 'I06', 'I07'],
	throt_rev: ['100%', '75%', '50%', '25%'],
	throt_ztc: false,
	throt_cal: false,
	input_mode: ['I08', 'I09', 'I10', 'iBUS', 'SBUS', 'CRSF', 'EXBUS', 'HoTT'],
	telem_mode: ['KISS', 'KISS auto', 'iBUS', 'S.Port', 'CRSF', 'MSB', 'HoTT'],
	prot_sens: ['I11', 'I12', 'I13'],
	music: '',
	bec: ['5.5V', '6.5V', '7.4V', '8.4V', '12V'],
	led: bitfield(4),
};

const deps = [
	{ // Disable if checked
		arm: ['throt_set'],
		brushed: ['timing', 'sine_range', 'sine_power', 'freq_min', 'duty_spup', 'duty_ramp', 'duty_lock', 'throt_ztc', 'prot_stall'],
	},
	{ // Enable if checked
	},
];

let strs, ws, bn, bi, rt, ival, timer, target, throtval, delayed, blocked, tabnum, tabvis = {};

async function fetchlang(lang) {
	const data = await fetch(`?${lang}`);
	return data.json();
}

async function setlang(lang) {
	try {
		strs = await fetchlang(lang);
		localStorage.setItem('lang', lang);
		document.getElementById('lang').value = lang;
		document.querySelectorAll('[data-lang]').forEach(elem => {
			const key = elem.getAttribute('data-lang');
			elem.innerHTML = strs[key] || '';
		});
		updateTelemRunLabel();
	} catch (err) {
		if (lang == 'en') throw err;
		setlang('en');
	}
}

function send(cmd) {
	if (ws.readyState != ws.OPEN) return;
	ws.send(cmd);
}

function clearresults() {
	clearInterval(bi);
	const elems = document.getElementsByClassName('result');
	for (let i = 0; i < elems.length; ++i) elems[i].style.display = 'none';
}

function setresult(n, ok, key, cnt) {
	clearresults();
	const elem = document.getElementById('result' + n);
	const style = elem.style;
	style.display = 'none';
	style.color = ok ? 'var(--grn)' : 'var(--red)';
	const str = strs[key];
	elem.setAttribute('data-lang', str && key || '');
	elem.innerHTML = str || key || '';
	style.display = 'inline';
	if (cnt == null) return;
	cnt <<= 1;
	bn = 0;
	bi = setInterval(() => {
		if (++bn == cnt) clearInterval(bi);
		else style.display = bn & 1 ? 'none' : 'inline';
	}, 200);
}

function opentab(n) {
	if (blocked) return;
	if (!n) n = tabnum;
	tabnum = n;
	tabvis = {};
	clearresults();
	const items = document.getElementsByClassName('item');
	const tabs = document.getElementsByClassName('tab');
	for (let i = 0; i < items.length; ++i) items[i].className = 'item';
	for (let i = 0; i < tabs.length; ++i) tabs[i].style.display = 'none';
	document.getElementById('item' + n).className = 'item active';
	document.getElementById('tab' + n + 'off').style.display = 'block';
	if (!ws || ws.readyState != ws.OPEN) {
		connect();
		return;
	}
	clearInterval(ival);
	clearTimeout(timer);
	switch (n) {
		case 1:
			if (delayed) {
				timer = setTimeout(() => {delayed = null, opentab(1)}, 2000);
				break;
			}
			ival = startInfoPoll();
			send('info\n');
			send('show\n');
			resettimer(1);
			break;
		case 3:
			ival = setInterval(() => {blocked || send('_probe\n')}, 300);
			send('_probe\n');
			resettimer(3);
			delayed = true;
			break;
		default:
			showtab(n);
			break;
	}
}

function showtab(n) {
	if (!n) n = tabnum;
	else if (n != tabnum) return;
	document.getElementById('tab' + n + 'off').style.display = 'none';
	document.getElementById('tab' + n + 'on').style.display = 'block';
	tabvis[n] = true;
}

function hidetab(n) {
	if (!n) n = tabnum;
	else if (n != tabnum) return;
	document.getElementById('tab' + n + 'off').style.display = 'block';
	document.getElementById('tab' + n + 'on').style.display = 'none';
	tabvis[n] = null;
}

function resettimer(n) {
	if (n && n != tabnum) return;
	clearTimeout(timer);
	timer = setTimeout(() => {
		ws.onopen = null;
		ws.onmessage = null;
		ws.onclose = null;
		ws.close();
		hidetab();
		connect();
	}, 2000);
}

function getfield(key, val) {
	const data = params[key];
	switch (typeof data) {
		case 'boolean':
			return `<input type="checkbox" id="field_${key}"${val != 0 ? ' checked' : ''} onchange="setparam('${key}', checked ? '1' : '0')">`;
		case 'string':
			return `<input type="text" maxlength="255" id="field_${key}" value="${val}" class="str" onchange="setparam('${key}', value)">`;
		case 'object':
			const res = [];
			res.push(`<select id="field_${key}" onchange="setparam('${key}', value)">`);
			for (let i = 0; i < data.length; ++i) {
				const key = data[i];
				const str = strs[key];
				res.push(`<option value="${i}"${str ? ` data-lang="${key}"`: ''}"${val == i ? ' selected' : ''}>${str || key}</option>`);
			}
			res.push('</select>');
			return res.join('');
		case 'function':
			return data(key, val);
		default:
			return `<input type="text" maxlength="5" id="field_${key}" value="${val}" class="val" onchange="setparam('${key}', value)">`;
	}
}

function geterror(res) {
	switch (res) {
		case '0':  return 'S14';
		case '1':  return 'S15';
		case '-1': return 'S16';
		default:   return `${strs['S17']} ${res}`;
	}
}

function checkdeps() {
	const res = {};
	for (let i = 0; i < 2; ++i) {
		const map = deps[i];
		for (key in map) {
			const elem = document.getElementById('field_' + key);
			if (elem) map[key].forEach(key => {res[key] |= i ^ elem.checked});
		}
	}
	for (key in res) {
		const elem = document.getElementById('field_' + key);
		if (elem) document.getElementById('label_' + key).className = (elem.disabled = res[key]) ? 'greyed' : '';
	}
}

function handler1(data, key, val) { // 'get', 'set'
	if (!data) {
		if (!val) return;
		send(`get ${key}\n`);
		return;
	}
	[key, val] = data[0].split(': ');
	if (key in bitvals) {
		const elems = document.getElementsByClassName('field_' + key);
		for (let i = 0; i < elems.length; ++i) elems[i].checked = val & 1 << i;
		bitvals[key] = val;
		return;
	}
	const elem = document.getElementById('field_' + key);
	if (elem.type != 'checkbox') {
		elem.value = val;
		return;
	}
	elem.checked = val != 0;
	checkdeps();
}

function handler2(ok) { // 'save', 'reset'
	setresult(tabnum, ok, ok ? 'S18' : 'S19', 3);
	send('show\n');
}

const handlers = {
	info: (data) => {
		if (!data) return;
		document.getElementById('info').innerHTML = data.join('<br>');
		if (telemRunning) {
			pushTelem(parseTelem(data));
			drawTelemChart();
		}
		resettimer(1);
	},
	show: (data) => {
		if (!data) return;
		const res = [];
		for (let i = 0; i < data.length; ++i) {
			const [key, val] = data[i].split(': ');
			res.push('<tr>');
			res.push(`<td><label for="field_${key}" id="label_${key}">${key}</label></td>`);
			res.push(`<td class="min">${getfield(key, val)} <span class="hint" data-lang="${key}">${strs[key] || ''}</span></td>`);
			res.push('</tr>');
		}
		document.getElementById('show').innerHTML = res.join('');
		checkdeps();
		showtab(1);
	},
	get: handler1,
	set: handler1,
	save: handler2,
	reset: handler2,
	throt: (ok, val) => {
		if (!ok) return;
		if (throtval == val) throtval = null;
		else send(`throt ${throtval}\n`);
	},
	_probe: (ok) => {
		if (!ok) hidetab(3);
		else if (!tabvis[3]) send('_info\n');
		resettimer(3);
	},
	_reboot: (ok) => {
		setresult(1, !!ok, ok ? 'S32' : 'S16', 3);
		if (!ok) {
			opentab(1);
			return;
		}
		setTimeout(() => opentab(1), 700);
	},
	_info: (data) => {
		if (!data) return;
		const res = [];
		const pins = ['PA2', 'PA6', 'PB4', 'PA5'];
		const [rev, pin, mcu] = data[0].split(' ');
		target = data[1] && data[2];
		res.push(`<span data-lang="S11">${strs['S11']}</span> ${rev}` + (pin != 0 ? ` [IO:${pins[pin - 1] || pin}, MCU:${mcu}]` : ''));
		res.push(target ? `<span data-lang="S12">${strs['S12']}</span> ${data[1]} [${data[2]}]` : `<span data-lang="S13">${strs['S13']}</span>`);
		document.getElementById('status').value = 0;
		document.getElementById('fwinfo').innerHTML = res.join('<br>');
		showtab(3);
	},
	_setwrp: (ok) => {
		setresult(3, ok, ok ? 'S18' : 'S19', 3);
		if (ok) document.getElementById('wrp').value = 0;
	},
	_update: (ok) => {
		if (!ok) {
			setresult(4, null, 'S20', 3);
			return;
		}
		setresult(4, true, 'S21', 0);
		blocked = true;
	},
	_status: (_, val) => {
		document.getElementById('status').value = val;
		resettimer(3);
	},
	_result: (_, res) => {
		blocked = null;
		setresult(4, res == 0, geterror(res));
		send('_info\n');
		if (res != 0) return;
		document.getElementById('image').value = '';
		document.getElementById('boot').value = 0;
		document.getElementById('wrp').value = 0;
		document.getElementById('force').checked = false;
	},
};

function connect() {
	resettimer();
	ws = new WebSocket('ws://192.168.4.1/ws');
	ws.onopen = () => {
		throtval = null;
		blocked = null;
		opentab();
	}
	ws.onmessage = (msg) => {
		const data = msg.data.split('\n');
		const args = data.shift().split(' ');
		const cmd = args.shift();
		data.pop(); // Pop empty string
		handlers[cmd](data.length && data.pop() == 'OK' ? data : null, ...args);
	}
	ws.onclose = () => {
		hidetab();
		resettimer();
	}
}

function setparam(key, val) {
	val = val.replace(/\s+/g, '');
	if (val.length) send(`set ${key} ${val}\n`);
	else send(`get ${key}\n`);
}

function setthrot(val) {
	if (throtval == null) send(`throt ${val}\n`);
	throtval = val;
}

const TELEM_UNITS = {Temp: 'C', ext: 'C', Volt: 'V', Curr: 'A', Csum: 'mAh', ERPM: ''};
const telemBuf = {t: [], Temp: [], ext: [], Volt: [], Curr: [], Csum: [], ERPM: []};
let telemRunning = true;
let telemHz = 2;
let telemWindowMin = 1;
let telemFreezeAt = null;

function telemWindowMs() {
	return telemWindowMin * 60000;
}

function trimTelemBuf(ref) {
	if (ref == null) ref = telemRunning ? Date.now() : (telemFreezeAt ?? Date.now());
	const cut = ref - telemWindowMs();
	while (telemBuf.t.length && telemBuf.t[0] < cut) {
		telemBuf.t.shift();
		for (const key of Object.keys(TELEM_UNITS)) telemBuf[key].shift();
	}
}

function startInfoPoll() {
	clearInterval(ival);
	if (tabnum !== 1) return null;
	return setInterval(() => {send('info\n')}, 1000 / telemHz);
}

function updateTelemRunLabel() {
	const el = document.getElementById('telemrun');
	if (!el || !strs) return;
	const key = telemRunning ? 'B10' : 'B09';
	el.setAttribute('data-lang', key);
	el.innerHTML = strs[key] || '';
}

function toggleTelemRun() {
	telemRunning = !telemRunning;
	if (telemRunning) telemFreezeAt = null;
	else telemFreezeAt = Date.now();
	updateTelemRunLabel();
	drawTelemChart();
}

function clearTelemChart() {
	const key = getTelemSeries();
	const ys = telemBuf[key];
	if (!ys) return;
	for (let i = 0; i < ys.length; ++i) ys[i] = null;
	drawTelemChart();
}

function setTelemHz(val) {
	telemHz = Number(val) || 2;
	document.getElementById('telemhz').value = String(telemHz);
	ival = startInfoPoll();
	if (tabnum === 1) send('info\n');
}

function setTelemWindow(val) {
	telemWindowMin = Number(val) || 1;
	document.getElementById('telemwin').value = String(telemWindowMin);
	trimTelemBuf();
	drawTelemChart();
}

function exportTelemCsv() {
	const n = telemBuf.t.length;
	if (!n) return;
	const keys = Object.keys(TELEM_UNITS);
	let csv = 'time_ms,' + keys.join(',') + '\n';
	for (let i = 0; i < n; ++i) {
		const row = [telemBuf.t[i]];
		for (const key of keys) {
			const v = telemBuf[key][i];
			row.push(v == null || Number.isNaN(v) ? '' : v);
		}
		csv += row.join(',') + '\n';
	}
	const d = new Date();
	const pad = (x) => String(x).padStart(2, '0');
	const info = (document.getElementById('info').textContent || '').split('\n')[0];
	const m = info.match(/rev([\d.]+)\s*\[([^\]]+)\]/i);
	const prefix = m ? m[2] : 'escape32';
	const fname = `${prefix}-telem-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.csv`;
	const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
	const a = document.createElement('a');
	a.href = URL.createObjectURL(blob);
	a.download = fname;
	a.click();
	URL.revokeObjectURL(a.href);
}

function parseTelem(data) {
	const text = data.join('\n');
	const num = (re) => {
		const m = text.match(re);
		return m ? Number(m[1]) : null;
	};
	return {
		Temp: num(/Temp:\s*(-?[\d.]+)/),
		ext: num(/ext\s+(-?[\d.]+)/),
		Volt: num(/Volt:\s*(-?[\d.]+)/),
		Curr: num(/Curr:\s*(-?[\d.]+)/),
		Csum: num(/Csum:\s*(-?[\d.]+)/),
		ERPM: num(/ERPM:\s*(-?[\d.]+)/),
	};
}

function pushTelem(vals) {
	const now = Date.now();
	telemBuf.t.push(now);
	for (const key of Object.keys(TELEM_UNITS)) telemBuf[key].push(vals[key]);
	trimTelemBuf(now);
}

function getTelemSeries() {
	const el = document.querySelector('input[name="telemseries"]:checked');
	return el ? el.value : 'Volt';
}

function drawTelemChart() {
	const canvas = document.getElementById('telemchart');
	if (!canvas) return;
	const dpr = window.devicePixelRatio || 1;
	const cssW = canvas.clientWidth || canvas.parentElement.clientWidth || 320;
	const cssH = 180;
	if (canvas.width != Math.round(cssW * dpr) || canvas.height != Math.round(cssH * dpr)) {
		canvas.width = Math.round(cssW * dpr);
		canvas.height = Math.round(cssH * dpr);
	}
	const ctx = canvas.getContext('2d');
	ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
	const W = cssW, H = cssH;
	const padL = 48, padR = 10, padT = 12, padB = 22;
	const plotW = Math.max(1, W - padL - padR);
	const plotH = Math.max(1, H - padT - padB);
	const style = getComputedStyle(document.documentElement);
	const bg = style.getPropertyValue('--eee').trim() || '#333';
	const fg = style.getPropertyValue('--222').trim() || '#ddd';
	const grid = style.getPropertyValue('--ddd').trim() || '#444';
	const line = style.getPropertyValue('--sel').trim() || '#72a2e0';

	ctx.clearRect(0, 0, W, H);
	ctx.fillStyle = bg;
	ctx.fillRect(0, 0, W, H);

	const key = getTelemSeries();
	const unit = TELEM_UNITS[key] || '';
	const now = telemRunning ? Date.now() : (telemFreezeAt ?? Date.now());
	const winMs = telemWindowMs();
	const t0 = now - winMs;
	const xs = telemBuf.t;
	const ys = telemBuf[key] || [];
	const pts = [];
	for (let i = 0; i < xs.length; ++i) {
		if (ys[i] == null || Number.isNaN(ys[i])) continue;
		if (xs[i] < t0) continue;
		pts.push({x: xs[i], y: ys[i]});
	}

	let ymin = 0, ymax = 1;
	if (pts.length) {
		ymin = ymax = pts[0].y;
		for (const p of pts) {
			if (p.y < ymin) ymin = p.y;
			if (p.y > ymax) ymax = p.y;
		}
	}
	if (ymax <= ymin) {
		const pad = Math.max(1, Math.abs(ymin) * 0.05) || 1;
		ymin -= pad;
		ymax += pad;
	} else {
		const pad = (ymax - ymin) * 0.08;
		ymin -= pad;
		ymax += pad;
	}

	const xOf = (t) => padL + ((t - t0) / winMs) * plotW;
	const yOf = (v) => padT + (1 - (v - ymin) / (ymax - ymin)) * plotH;

	ctx.strokeStyle = grid;
	ctx.lineWidth = 1;
	ctx.fillStyle = fg;
	ctx.font = '11px Menlo, Monaco, Consolas, monospace';
	ctx.textAlign = 'right';
	ctx.textBaseline = 'middle';
	for (let i = 0; i <= 4; ++i) {
		const v = ymin + (ymax - ymin) * (i / 4);
		const y = yOf(v);
		ctx.beginPath();
		ctx.moveTo(padL, y);
		ctx.lineTo(W - padR, y);
		ctx.stroke();
		const label = Math.abs(v) >= 100 ? v.toFixed(0) : (Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2));
		ctx.fillText(unit ? `${label}${unit}` : label, padL - 4, y);
	}

	ctx.textAlign = 'center';
	ctx.textBaseline = 'top';
	const totalSec = telemWindowMin * 60;
	const useMin = totalSec >= 120;
	const axisLabel = (sec) => {
		if (sec === 0) return '0s';
		if (useMin) return `-${sec / 60}min`;
		return `-${sec}s`;
	};
	for (const sec of [totalSec, totalSec / 2, 0]) {
		const t = now - sec * 1000;
		const x = xOf(t);
		ctx.beginPath();
		ctx.moveTo(x, padT);
		ctx.lineTo(x, padT + plotH);
		ctx.stroke();
		ctx.fillText(axisLabel(sec), x, padT + plotH + 4);
	}

	ctx.strokeStyle = fg;
	ctx.strokeRect(padL + 0.5, padT + 0.5, plotW - 1, plotH - 1);

	if (!pts.length) {
		ctx.textAlign = 'center';
		ctx.textBaseline = 'middle';
		ctx.fillStyle = fg;
		ctx.fillText(key, padL + plotW / 2, padT + plotH / 2);
		return;
	}

	ctx.strokeStyle = line;
	ctx.lineWidth = 1.5;
	ctx.beginPath();
	for (let i = 0; i < pts.length; ++i) {
		const x = xOf(pts[i].x);
		const y = yOf(pts[i].y);
		if (i === 0) ctx.moveTo(x, y);
		else ctx.lineTo(x, y);
	}
	ctx.stroke();
}

window.addEventListener('resize', () => drawTelemChart());

function setvolume(val) {
	document.getElementById('volume').value = val;
	document.getElementById('volval').innerHTML = `${val}%`;
}

function savecfg() {
	send('save\n');
}

function collectcfg() {
	const cfg = {};
	const labels = document.querySelectorAll('#show label[id^="label_"]');
	for (let i = 0; i < labels.length; ++i) {
		const key = labels[i].id.slice(6);
		let val;
		if (key in bitvals) {
			val = Number(bitvals[key]);
		} else {
			const elem = document.getElementById('field_' + key);
			if (!elem) continue;
			if (elem.type == 'checkbox') val = !!elem.checked;
			else if (elem.type == 'select-one' || /^-?\d+$/.test(elem.value)) val = Number(elem.value);
			else val = elem.value;
		}
		cfg[key] = val;
	}
	return cfg;
}

function exportcfg() {
	const cfg = collectcfg();
	if (!Object.keys(cfg).length) {
		setresult(1, false, 'S31', 3);
		return;
	}
	const obj = {version: 1};
	const info = (document.getElementById('info').textContent || '').split('\n')[0];
	const m = info.match(/rev([\d.]+)\s*\[([^\]]+)\]/i);
	if (m) obj.target = m[2];
	obj.config = cfg;
	const blob = new Blob([JSON.stringify(obj, null, 2) + '\n'], {type: 'application/json'});
	const a = document.createElement('a');
	a.href = URL.createObjectURL(blob);
	a.download = m ? `${m[2]}-rev${m[1]}.json` : 'escape32-cfg.json';
	a.click();
	URL.revokeObjectURL(a.href);
	setresult(1, true, 'S30', 3);
}

function importcfg(input) {
	const file = input.files && input.files[0];
	input.value = '';
	if (!file) return;
	const fr = new FileReader();
	fr.onload = () => {
		let obj;
		try {
			obj = JSON.parse(fr.result);
		} catch (e) {
			setresult(1, false, 'S31', 3);
			return;
		}
		let cfg = obj && typeof obj.config == 'object' && obj.config ? obj.config : obj;
		if (!cfg || typeof cfg != 'object' || Array.isArray(cfg)) {
			setresult(1, false, 'S31', 3);
			return;
		}
		const skip = {version: 1, target: 1, config: 1};
		let n = 0;
		for (const key in cfg) {
			if (skip[key] || typeof cfg[key] == 'object') continue;
			let val = cfg[key];
			if (typeof val == 'boolean') val = val ? '1' : '0';
			else val = String(val);
			setparam(key, val);
			++n;
		}
		if (!n) {
			setresult(1, false, 'S31', 3);
			return;
		}
		setresult(1, true, 'S18', 3);
		setTimeout(() => send('show\n'), 400);
	};
	fr.onerror = () => setresult(1, false, 'S31', 3);
	fr.readAsText(file);
}

function resetcfg(cancel) {
	if (rt) {
		clearTimeout(rt);
		bn = 8;
	}
	if (cancel) return;
	rt = setTimeout(() => {rt = null, send('reset\n')}, 2000);
	setresult(1, null, 'S29', 5);
}

function rebootesc() {
	if (blocked) return;
	clearInterval(ival);
	ival = null;
	setresult(1, null, 'S32', 0);
	send('_reboot\n');
}

function parsemusic() {
	const data = document.getElementById('music').value.replace(/\s+/g, '');
	const chunks = data.split(':');
	if (chunks.length != 3) return data; // Not in RTTTL format
	let defdur = 16, defoct = 4, defbpm = 120;
	chunks[1].split(',').forEach(item => {
		const [key, val] = item.split('=');
		switch (key) {
			case 'd':
				defdur = Math.min(Math.max(parseInt(val), 1), 32);
				break;
			case 'o':
				defoct = Math.min(Math.max(parseInt(val), 4), 7);
				break;
			case 'b':
				defbpm = Math.min(Math.max(parseInt(val), 20), 999);
				break;
			default:
				console.warn(`Discarding invalid option '${key}'`);
				break;
		}
	});
	let maxdur = 1, minoct = 7;
	const notes = chunks[2].split(',').map(item => {
		const parts = item.match(/^(1|2|4|8|16|32)?((?:[a-g]|h|p)#?)(\.?)(4|5|6|7)?$/);
		if (!parts) {
			console.warn(`Discarding invalid note '${item}'`);
			return [];
		}
		let note = parts[2];
		if (note === 'h') note = 'b';
		else if (note == 'p') note = '_';
		const dot = parts[3] == '.';
		const dur = parseInt(parts[1]) || defdur;
		const oct = parseInt(parts[4]) || defoct;
		if (maxdur < dur) maxdur = dur;
		if (minoct > oct) minoct = oct;
		return [note, dot, dur, oct];
	});
	let durofs = 0, curoct = 4;
	if (maxdur == 32) {
		defbpm <<= 1;
		maxdur >>= 1;
		--durofs;
	} else while (defbpm >= 20 && maxdur < 16) {
		defbpm >>= 1;
		maxdur <<= 1;
		++durofs;
	}
	defbpm <<= 1;
	if (defbpm > 999) defbpm = 999;
	const octofs = minoct - 4;
	const res = [defbpm];
	for (let i = 0; i < notes.length; ++i) {
		let [note, dot, dur, oct] = notes[i];
		if (!note) continue;
		dur = 32 / dur;
		if (durofs < 0) dur <<= -durofs;
		else if (durofs > 0) dur >>= durofs;
		if (dot) dur += dur >> 1;
		oct -= octofs;
		if (oct > 6) oct = 6;
		if (oct > curoct + 1) {
			++curoct;
			res.push('+');
		} else if (oct < curoct) {
			--curoct;
			res.push('-');
		}
		if (oct > curoct) note = note.toUpperCase();
		res.push(note);
		if (dur > 1) res.push(dur);
	}
	return res.join('');
}

function playmusic() {
	const music = parsemusic();
	const volume = document.getElementById('volume').value;
	if (!music || volume == 0) return;
	send(`play ${music} ${volume}\n`);
}

function savemusic() {
	const music = parsemusic();
	const volume = document.getElementById('volume').value;
	if (!music) return;
	setparam('music', music);
	setparam('volume', volume);
	savecfg();
}

function clearmusic() {
	document.getElementById('music').value = '';
	setvolume(25);
}

function setwrp() {
	if (blocked) return;
	const wrp = document.getElementById('wrp').value;
	if (wrp == 0) setresult(3, null, 'S22', 3);
	else send(`_setwrp ${wrp}\n`);
}

function update() {
	if (blocked) return;
	const file = document.getElementById('image').files[0];
	if (!file) {
		setresult(4, null, 'S23', 3);
		return;
	}
	const fr = new FileReader();
	fr.onload = () => {
		const data = fr.result;
		const size = data.byteLength;
		const boot = document.getElementById('boot').value;
		const wrp = document.getElementById('wrp').value;
		const force = document.getElementById('force').checked;
		try {
			if (!size) throw 'S24';
			if (size > (boot != 0 ? 4096 : 262144)) throw 'S25';
			if (!force) {
				if (boot != 0) throw 'S26';
				const info = new Uint8Array(data.slice(0, 20));
				if (info[0] != 0xea || info[1] != 0x32) throw 'S27';
				let i, j = target.length;
				for (i = 0; i < j && target.charCodeAt(i) == info[i + 4]; ++i);
				if (i < j || info[i + 4] && j) throw 'S28';
			}
			setresult(4);
			send(`_update ${size} ${boot} ${wrp}\n`);
			for (let pos = 0; pos < size; pos += 32768) send(data.slice(pos, pos + 32768));
		} catch (err) {
			if (typeof err != 'string') throw err;
			setresult(4, null, err, 3);
		}
	}
	fr.readAsArrayBuffer(file);
}

setlang(localStorage.getItem('lang') || navigator.language.substring(0, 2) || 'en');
setvolume(25);
opentab(1);
drawTelemChart();
